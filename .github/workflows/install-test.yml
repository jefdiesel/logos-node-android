name: install-test
# Runs the installers on clean arm64 Linux machines and checks the node and the web app for real.
# These are not Android phones: they test the scripts and the app (same CPU type, same node binary).
on:
  push:
    paths: [install.sh, install-termux.sh, 'app/**', 'tests/**', .github/workflows/install-test.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fresh-install:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Run the installer on a clean machine
        run: APP_SRC="$PWD/app" SWAP_GB=1 sh install.sh
      - name: Both services are running
        run: systemctl is-active logos-node logos-node-app
      - name: The web app page answers
        # the app was (re)started a moment ago: give it a few seconds to open its port
        run: |
          curl -fsS --retry 10 --retry-connrefused --retry-delay 1 http://127.0.0.1:8090/ | grep -q "<title>Logos node</title>"
          curl -fsS http://127.0.0.1:8090/names/names.js | grep -q "27029987a81e703c88876d967c04a25f4c841681"
          curl -fsS http://127.0.0.1:8090/names/noble-hashes/argon2.js | grep -q "argon2id"
      - name: Node joins the testnet and syncs blocks
        run: |
          for i in $(seq 1 36); do
            H=$(curl -fsS -m 5 http://127.0.0.1:8090/cryptarchia/info | grep -oE '"height":[0-9]+' | grep -oE '[0-9]+' || true)
            echo "height: ${H:-no answer yet}"
            if [ -n "$H" ] && [ "$H" -gt 100 ]; then exit 0; fi
            sleep 10
          done
          journalctl -u logos-node --no-pager -n 60
          exit 1
      - name: The status says the node is behind the chain and catching up, with where the chain is
        run: python3 tests/wallet_test.py sync-behind
      - name: How the app reads the node's sync state, against recorded examples
        run: python3 tests/sync_test.py
      - name: Node API on port 880 (below the Terminal app's port prompt) keeps other websites out
        run: |
          ss -ltn | grep -E "127.0.0.1:880 " || { echo "the node API isn't on 127.0.0.1:880"; exit 1; }
          if ss -ltn | grep -q ":8080 "; then echo "something still listens on 8080"; exit 1; fi
          acao() { curl -s -i -H "Origin: $1" http://127.0.0.1:880/cryptarchia/info | grep -i "^access-control-allow-origin" | tr -d "\r" | cut -d" " -f2; }
          E=$(acao https://evil.example); I=$(acao http://127.0.0.1:8090)
          echo "another website gets: '${E:-no header}'; the app's page gets: '$I'"
          [ "$E" != "*" ] && [ "$E" != "https://evil.example" ] || exit 1
          [ "$I" = "http://127.0.0.1:8090" ] || exit 1
      - name: The app's ChaCha20-Poly1305 matches the RFC 8439 test vectors
        run: python3 tests/crypto_test.py
      - name: The cryptography package, for the independent backup opener
        run: python3 -c "import cryptography" 2>/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq python3-cryptography; }
      - name: Wallet locks (PIN, session, own page only, pause after wrong PINs) and the backup
        run: EVENTS_LOG="$HOME/node/app/wallet-events.log" KEYSTORE="$HOME/node/run/keystore.yaml" python3 tests/wallet_test.py guard
      - name: Restore a wallet backup on the real node (new keys first, as on a new device)
        run: |
          sudo systemctl restart logos-node-app     # clears the PIN pause guard left, which lives in memory
          curl -fsS --retry 10 --retry-connrefused --retry-delay 1 -o /dev/null http://127.0.0.1:8090/
          export APP_PIN=246810 KEYSTORE="$HOME/node/run/keystore.yaml" RESTORE_STATE="$RUNNER_TEMP/restore.json" EVENTS_LOG="$HOME/node/app/wallet-events.log"
          python3 tests/wallet_test.py restore-before
          sudo systemctl stop logos-node
          mkdir "$RUNNER_TEMP/fresh" && cd "$RUNNER_TEMP/fresh" && ~/node/logos-blockchain-node init-config -o user_config.yaml >/dev/null
          cp keystore.yaml "$KEYSTORE" && cd ~/node/run && ../logos-blockchain-node --check-config user_config.yaml | tail -1
          sudo systemctl start logos-node
          BEFORE=$(systemctl show -p MainPID --value logos-node)
          cd "$GITHUB_WORKSPACE" && python3 tests/wallet_test.py restore-after
          AFTER=$(systemctl show -p MainPID --value logos-node)
          echo "node process before the restore: $BEFORE, after: $AFTER"
          if [ "$BEFORE" = "$AFTER" ]; then echo "the node was not restarted"; exit 1; fi
          systemctl is-active logos-node logos-node-app
          ls -l ~/node/run/keystore.yaml*
      - name: In-app update under systemd (re-executes in place; the node keeps running)
        run: |
          sudo mkdir -p /etc/systemd/system/logos-node-app.service.d
          printf '[Service]\nEnvironment=UPDATE_URL=http://127.0.0.1:8765/app/\n' | sudo tee /etc/systemd/system/logos-node-app.service.d/test.conf
          sudo systemctl daemon-reload && sudo systemctl restart logos-node-app
          curl -fsS --retry 10 --retry-connrefused --retry-delay 1 -o /dev/null http://127.0.0.1:8090/
          APP_BEFORE=$(systemctl show -p MainPID --value logos-node-app); NODE_BEFORE=$(systemctl show -p MainPID --value logos-node)
          APP_DIR="$HOME/node/app" APP_PIN=246810 python3 tests/update_test.py
          APP_AFTER=$(systemctl show -p MainPID --value logos-node-app); NODE_AFTER=$(systemctl show -p MainPID --value logos-node)
          echo "app process $APP_BEFORE -> $APP_AFTER, node process $NODE_BEFORE -> $NODE_AFTER"
          if [ "$APP_BEFORE" != "$APP_AFTER" ]; then echo "the app did not re-execute in place"; exit 1; fi
          if [ "$NODE_BEFORE" != "$NODE_AFTER" ]; then echo "the node was restarted"; exit 1; fi
          systemctl is-active logos-node logos-node-app
  app-update:
    # The in-app update with the app started the way Termux's start script starts it: in the background
    # of a shell that then execs another program. A local HTTP server stands in for the GitHub repository.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: release.json matches the app files, the version and both installers
        run: python3 tools/release.py check
      - name: The page's script parses
        run: |
          python3 -c "import re,sys; sys.stdout.write(re.search(r'<script>(.*)</script>', open('app/index.html').read(), re.S).group(1))" > "$RUNNER_TEMP/page.js"
          node --check "$RUNNER_TEMP/page.js"
      - name: Update the app in place
        run: |
          cp -r app "$RUNNER_TEMP/app"
          printf '#!/bin/sh\nUPDATE_URL=http://127.0.0.1:8765/app/ NODE_BIN=/nonexistent python3 %s/app/server.py >/dev/null 2>&1 &\nexec sleep 900\n' "$RUNNER_TEMP" > "$RUNNER_TEMP/start.sh"
          nohup sh "$RUNNER_TEMP/start.sh" >/dev/null 2>&1 &
          curl -fsS --retry 10 --retry-connrefused --retry-delay 1 -o /dev/null http://127.0.0.1:8090/
          BEFORE=$(pgrep -f "$RUNNER_TEMP/app/server.py")
          APP_DIR="$RUNNER_TEMP/app" APP_PIN=135790 python3 tests/update_test.py
          AFTER=$(pgrep -f "$RUNNER_TEMP/app/server.py")
          echo "app process $BEFORE -> $AFTER"
          if [ "$BEFORE" != "$AFTER" ]; then echo "the app did not re-execute in place"; exit 1; fi
      - name: Auto-lock (idle time, leaving the page, the setting), with timings shortened to seconds
        run: python3 tests/autolock_test.py
  wallet-send:
    # A real transfer through the web app, on a private one-node chain with the node's public test keys.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Start a one-node test chain and the web app
        run: |
          V=0.3.4
          mkdir chain && cd chain
          curl -fsSL "https://github.com/logos-blockchain/logos-blockchain/releases/download/$V/logos-blockchain-node-linux-aarch64-$V.tar.gz" | tar xz
          for f in standalone-node-config.yaml standalone-deployment-config.yaml; do
            curl -fsSL -o $f "https://raw.githubusercontent.com/logos-blockchain/logos-blockchain/$V/nodes/node/$f"
          done
          nohup ./logos-blockchain-node --deployment standalone-deployment-config.yaml standalone-node-config.yaml > node.log 2>&1 &
          NODE_BIN="$PWD/logos-blockchain-node" NODE_CFG="$PWD/standalone-node-config.yaml" \
          NODE_DEPLOYMENT="$PWD/standalone-deployment-config.yaml" APP_DATA="$PWD" \
          NAMES_RPC_URL=http://127.0.0.1:18545 NAMES_PROGRAM=US517G5965aydkZ46HS38QLi7UQiSojurfbQfKCELFx \
            nohup python3 ../app/server.py > app.log 2>&1 &
          sleep 5
      - name: Send coins through the web app and check both balances
        run: python3 tests/wallet_test.py send
      - name: LNS names - the vendored resolver against the SPEC vectors, then lookups and a send through the app
        run: |
          node --version
          APP_BASE=http://127.0.0.1:8090 APP_PIN=135790 \
          NAMES_FROM=e3635f207984ae779cf76b5f20714b514373f61ff96260879fe0a6d71f2dce07 \
          NAMES_TO=cce9796339efd968df9cd463bc2248e4b29c86409496e8b2599da8c4c1074d22 node tests/names_test.mjs
      - name: Logs, if something failed
        if: failure()
        run: tail -40 chain/node.log; cat chain/app.log
  termux:
    # Runs install-termux.sh inside the official Termux Docker image (Termux userland on arm64).
    # Not a real phone: it tests the script and that the node runs under proot.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install and start the node inside Termux
        run: |
          docker run --rm --security-opt seccomp=unconfined -e NO_WAKE_LOCK=1 -e APP_SRC=/repo/app -v "$PWD":/repo:ro termux/termux-docker:aarch64 bash -c '
            set -e
            sh /repo/install-termux.sh
            (~/logos-node > ~/node.log 2>&1 &)
            for i in $(seq 1 36); do
              H=$(curl -fsS -m 5 http://127.0.0.1:8090/cryptarchia/info | grep -oE "\"height\":[0-9]+" | grep -oE "[0-9]+" || true)
              echo "height: ${H:-no answer yet}"
              if [ -n "$H" ] && [ "$H" -gt 100 ]; then
                curl -fsS http://127.0.0.1:8090/ | grep -q "<title>Logos node</title>" && echo "web app page ok" &&
                curl -fsS http://127.0.0.1:8090/names/lookup.js | grep -q lookupName && echo "names files ok" && exit 0
              fi
              sleep 10
            done
            tail -40 ~/node.log; exit 1'
  promote:
    # Phones update from the `release` branch. It moves to a commit only after every job above passed
    # on main, so a release reaches devices only once it is tested. This job alone may write.
    needs: [fresh-install, wallet-send, termux, app-update]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fast-forward release to the tested commit
        run: |
          python3 tools/release.py check
          if git fetch -q origin release; then
            if git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then echo "release already has this commit"; exit 0; fi
            git merge-base --is-ancestor FETCH_HEAD "$GITHUB_SHA" || { echo "release has commits main doesn't; not moving it"; exit 1; }
          fi
          git push origin "$GITHUB_SHA:refs/heads/release"
          echo "release -> $GITHUB_SHA (version $(python3 -c 'import json;print(json.load(open("app/release.json"))["version"])'))"
