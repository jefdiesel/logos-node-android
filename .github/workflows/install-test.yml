name: install-test
# Runs the installers on clean arm64 Linux machines and checks the node and the web app for real.
# These are not Android phones: they test the scripts and the app (same CPU type, same node binary).
on:
  push:
    paths: [install.sh, install-termux.sh, 'app/**', 'tests/**', .github/workflows/install-test.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fresh-install:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Run the installer on a clean machine
        run: APP_SRC="$PWD/app" SWAP_GB=1 sh install.sh
      - name: Both services are running
        run: systemctl is-active logos-node logos-node-app
      - name: The web app page answers
        # the app was (re)started a moment ago: give it a few seconds to open its port
        run: |
          curl -fsS --retry 10 --retry-connrefused --retry-delay 1 http://127.0.0.1:8090/ | grep -q "<title>Names Wallet</title>"
          curl -fsS http://127.0.0.1:8090/names/names.js | grep -q "27029987a81e703c88876d967c04a25f4c841681"
          curl -fsS http://127.0.0.1:8090/names/noble-hashes/argon2.js | grep -q "argon2id"
      - name: Node joins the testnet and syncs blocks
        run: |
          for i in $(seq 1 36); do
            H=$(curl -fsS -m 5 http://127.0.0.1:8090/cryptarchia/info | grep -oE '"height":[0-9]+' | grep -oE '[0-9]+' || true)
            echo "height: ${H:-no answer yet}"
            if [ -n "$H" ] && [ "$H" -gt 100 ]; then exit 0; fi
            sleep 10
          done
          journalctl -u logos-node --no-pager -n 60
          exit 1
      - name: The status says the node is behind the chain and catching up, with where the chain is
        run: python3 tests/wallet_test.py sync-behind
      - name: How the app reads the node's sync state, against recorded examples
        run: python3 tests/sync_test.py
      - name: Node API on port 880 (below the Terminal app's port prompt) keeps other websites out
        run: |
          ss -ltn | grep -E "127.0.0.1:880 " || { echo "the node API isn't on 127.0.0.1:880"; exit 1; }
          if ss -ltn | grep -q ":8080 "; then echo "something still listens on 8080"; exit 1; fi
          acao() { curl -s -i -H "Origin: $1" http://127.0.0.1:880/cryptarchia/info | grep -i "^access-control-allow-origin" | tr -d "\r" | cut -d" " -f2; }
          E=$(acao https://evil.example); I=$(acao http://127.0.0.1:8090)
          echo "another website gets: '${E:-no header}'; the app's page gets: '$I'"
          [ "$E" != "*" ] && [ "$E" != "https://evil.example" ] || exit 1
          [ "$I" = "http://127.0.0.1:8090" ] || exit 1
      - name: The app's ChaCha20-Poly1305 matches the RFC 8439 test vectors
        run: python3 tests/crypto_test.py
      - name: The cryptography package, for the independent backup opener
        run: python3 -c "import cryptography" 2>/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq python3-cryptography; }
      - name: Wallet locks (PIN, session, own page only, pause after wrong PINs) and the backup
        run: EVENTS_LOG="$HOME/node/app/wallet-events.log" KEYSTORE="$HOME/node/run/keystore.yaml" python3 tests/wallet_test.py guard
      - name: Restore a wallet backup on the real node (new keys first, as on a new device)
        run: |
          sudo systemctl restart logos-node-app     # clears the PIN pause guard left, which lives in memory
          curl -fsS --retry 10 --retry-connrefused --retry-delay 1 -o /dev/null http://127.0.0.1:8090/
          export APP_PIN=246810 KEYSTORE="$HOME/node/run/keystore.yaml" RESTORE_STATE="$RUNNER_TEMP/restore.json" EVENTS_LOG="$HOME/node/app/wallet-events.log"
          python3 tests/wallet_test.py restore-before
          sudo systemctl stop logos-node
          mkdir "$RUNNER_TEMP/fresh" && cd "$RUNNER_TEMP/fresh" && ~/node/logos-blockchain-node init-config -o user_config.yaml >/dev/null
          cp keystore.yaml "$KEYSTORE" && cd ~/node/run && ../logos-blockchain-node --check-config user_config.yaml | tail -1
          sudo systemctl start logos-node
          BEFORE=$(systemctl show -p MainPID --value logos-node)
          cd "$GITHUB_WORKSPACE" && python3 tests/wallet_test.py restore-after
          AFTER=$(systemctl show -p MainPID --value logos-node)
          echo "node process before the restore: $BEFORE, after: $AFTER"
          if [ "$BEFORE" = "$AFTER" ]; then echo "the node was not restarted"; exit 1; fi
          systemctl is-active logos-node logos-node-app
          ls -l ~/node/run/keystore.yaml*
      - name: In-app update under systemd (re-executes in place; the node keeps running)
        run: |
          sudo mkdir -p /etc/systemd/system/logos-node-app.service.d
          printf '[Service]\nEnvironment=UPDATE_URL=http://127.0.0.1:8765/app/\n' | sudo tee /etc/systemd/system/logos-node-app.service.d/test.conf
          sudo systemctl daemon-reload && sudo systemctl restart logos-node-app
          curl -fsS --retry 10 --retry-connrefused --retry-delay 1 -o /dev/null http://127.0.0.1:8090/
          APP_BEFORE=$(systemctl show -p MainPID --value logos-node-app); NODE_BEFORE=$(systemctl show -p MainPID --value logos-node)
          APP_DIR="$HOME/node/app" APP_PIN=246810 python3 tests/update_test.py
          APP_AFTER=$(systemctl show -p MainPID --value logos-node-app); NODE_AFTER=$(systemctl show -p MainPID --value logos-node)
          echo "app process $APP_BEFORE -> $APP_AFTER, node process $NODE_BEFORE -> $NODE_AFTER"
          if [ "$APP_BEFORE" != "$APP_AFTER" ]; then echo "the app did not re-execute in place"; exit 1; fi
          if [ "$NODE_BEFORE" != "$NODE_AFTER" ]; then echo "the node was restarted"; exit 1; fi
          systemctl is-active logos-node logos-node-app
  app-update:
    # The in-app update with the app started the way Termux's start script starts it: in the background
    # of a shell that then execs another program. A local HTTP server stands in for the GitHub repository.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: release.json matches the app files, the version and both installers
        run: python3 tools/release.py check
      - name: The page's script parses
        run: |
          # every inline <script> of the page, each checked on its own (the theme one in <head>, the page's own)
          python3 -c "import re,sys,os; [open(os.path.join(sys.argv[1], 'page%d.js' % i), 'w').write(m) for i, m in enumerate(re.findall(r'<script>(.*?)</script>', open('app/index.html').read(), re.S))]" "$RUNNER_TEMP"
          for f in "$RUNNER_TEMP"/page*.js; do node --check "$f"; done
      - name: Update the app in place
        run: |
          cp -r app "$RUNNER_TEMP/app"
          printf '#!/bin/sh\nUPDATE_URL=http://127.0.0.1:8765/app/ NODE_BIN=/nonexistent python3 %s/app/server.py >/dev/null 2>&1 &\nexec sleep 900\n' "$RUNNER_TEMP" > "$RUNNER_TEMP/start.sh"
          nohup sh "$RUNNER_TEMP/start.sh" >/dev/null 2>&1 &
          curl -fsS --retry 10 --retry-connrefused --retry-delay 1 -o /dev/null http://127.0.0.1:8090/
          BEFORE=$(pgrep -f "$RUNNER_TEMP/app/server.py")
          APP_DIR="$RUNNER_TEMP/app" APP_PIN=135790 python3 tests/update_test.py
          AFTER=$(pgrep -f "$RUNNER_TEMP/app/server.py")
          echo "app process $BEFORE -> $AFTER"
          if [ "$BEFORE" != "$AFTER" ]; then echo "the app did not re-execute in place"; exit 1; fi
      - name: Auto-lock (idle time, leaving the page, the setting), with timings shortened to seconds
        run: python3 tests/autolock_test.py
      - name: Inside the Android app (APP_EMBEDDED=android) and unchanged without it
        run: python3 tests/embedded_test.py
      - name: Android app key - other apps on the phone get only the page's public files (android/LOCAL-APIS.md)
        run: python3 tests/app_key_test.py
      - name: The node API on a Unix socket (node patch 0002) - server.py's transport; it never touches the old TCP port, and takes answers only whole
        run: python3 tests/node_socket_test.py
      - name: A transfer the node gave no answer about is not invited twice (it may have gone through)
        run: python3 tests/send_unsure_test.py
      - name: Messages through the messaging runner's own Unix socket (REST off) - the runner's socket code with a stand-in library
        run: python3 tests/messaging_socket_test.py
      - name: A flood of large messages doesn't lose the batch (runner buffer bounded in bytes, answers read whole)
        run: python3 tests/messaging_batch_test.py
      - name: The phone's own LNS name (Android app only), with a stand-in signer and sequencer
        run: python3 tests/lns_test.py
      - name: Getting LEZ for the phone's name account (faucet, bridge through the node's API), with stand-ins
        run: python3 tests/lns_funding_test.py
      - name: Get this name in one tap (the chained job, restarts, retries), with stand-ins
        run: python3 tests/lns_flow_test.py
      - name: Apps already on phones (0.7.7, 0.8.0, 0.8.1, 0.9.2, 0.9.3, 0.9.4, 0.9.5, 0.9.6 and 0.9.7, as released) update themselves to this release
        run: |
          for rel in 0.7.7:152b0cb7fb692bc6bcb11a0808ae3cd3879aa51a 0.8.0:dfd0c0fda1541c438102991ba2e9ecac969192f1 0.8.1:5dbcfdf3dc52d9f487a2bf5be2ff389a224f78ee 0.9.2:bede7a313e35e38e9bd64d2b27105e63737b6db4 0.9.3:cb7f0b15a4184b4ee0abc114d13dfae9552bc915 0.9.4:1fa85487585aba671f5a76eb38fe0f2982ed7c3e 0.9.5:1129facb1f7dc04d8d5d457a8417c69fa360f19a 0.9.6:6cb9cce2b0f2eb87db8669a62468d0eecb65ddc1 0.9.7:e142499f496bf96051ce40bd19fd7635314ce726; do
            OLD="$RUNNER_TEMP/app-${rel%%:*}"; base=https://raw.githubusercontent.com/jefdiesel/logos-node-android/${rel#*:}/app
            mkdir -p "$OLD" && curl -fsSL -o "$OLD/release.json" "$base/release.json"
            for f in $(python3 -c "import json,sys; print(' '.join(json.load(open(sys.argv[1]))['files']))" "$OLD/release.json"); do
              mkdir -p "$OLD/$(dirname "$f")" && curl -fsSL -o "$OLD/$f" "$base/$f"
            done
            echo "from ${rel%%:*}"
            python3 tests/upgrade_test.py "$OLD"
          done
      - name: Messages between LNS names - interop with the names project, two apps through a fake messaging node, nothing new without one
        run: |
          python3 -c "import cryptography" 2>/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq python3-cryptography; }
          curl -fsSL -o "$RUNNER_TEMP/names-msg-crypto.js" \
            https://raw.githubusercontent.com/jefdiesel/logos-names/27029987a81e703c88876d967c04a25f4c841681/gateway/public/app/msg-crypto.js
          node --version
          NAMES_MSG_CRYPTO="$RUNNER_TEMP/names-msg-crypto.js" node tests/messaging_test.mjs
      - name: The messaging node switched on and off while the app runs (Android)
        run: python3 tests/messaging_switch_test.py
      - name: Chats - identity, 1:1 both ways, history, key change, addresses, profiles and notes through backup and restore (also into 0.8.1), paced sending
        run: |
          OLD="$RUNNER_TEMP/app-0.8.1-restore"; base=https://raw.githubusercontent.com/jefdiesel/logos-node-android/5dbcfdf3dc52d9f487a2bf5be2ff389a224f78ee/app
          mkdir -p "$OLD" && curl -fsSL -o "$OLD/release.json" "$base/release.json"
          for f in $(python3 -c "import json,sys; print(' '.join(json.load(open(sys.argv[1]))['files']))" "$OLD/release.json"); do
            mkdir -p "$OLD/$(dirname "$f")" && curl -fsSL -o "$OLD/$f" "$base/$f"
          done
          NAMES_MSG_CRYPTO="$RUNNER_TEMP/names-msg-crypto.js" OLD_APP="$OLD" node tests/chat_test.mjs
      - name: Hostile sender names (constructor, __proto__, ...) and 200 random ones never stop the chats
        run: node tests/msg_hostile_test.mjs
  chat-ui:
    # The Messages screen in headless Chrome at phone width (x64 runner: Chrome has no Linux arm64 build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Messages screen - empty states, chats, addresses, a key change, profiles, in a real browser
        run: CHROME="$(command -v google-chrome || command -v chromium)" node tests/chat_ui.mjs
      - name: Your name (Android app only) in a real browser, with a stand-in signer
        run: CHROME="$(command -v google-chrome || command -v chromium)" node tests/lns_ui.mjs
      - name: Android app key in a real browser - the page's requests carry the cookie, its scripts can't read it
        run: CHROME="$(command -v google-chrome || command -v chromium)" node tests/app_key_ui.mjs
  wallet-send:
    # A real transfer through the web app, on a private one-node chain with the node's public test keys.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Start a one-node test chain and the web app
        run: |
          V=0.3.4
          mkdir chain && cd chain
          curl -fsSL "https://github.com/logos-blockchain/logos-blockchain/releases/download/$V/logos-blockchain-node-linux-aarch64-$V.tar.gz" | tar xz
          for f in standalone-node-config.yaml standalone-deployment-config.yaml; do
            curl -fsSL -o $f "https://raw.githubusercontent.com/logos-blockchain/logos-blockchain/$V/nodes/node/$f"
          done
          # cors_origins in the shape the Android app writes (NodeFiles.writeConfig), for this job's app origin
          grep -q '^    cors_origins: \[ \]$' standalone-node-config.yaml
          sed -i 's|^    cors_origins: \[ \]$|    cors_origins:\n    - http://127.0.0.1:8090|' standalone-node-config.yaml
          ./logos-blockchain-node --deployment standalone-deployment-config.yaml standalone-node-config.yaml --check-config
          nohup ./logos-blockchain-node --deployment standalone-deployment-config.yaml standalone-node-config.yaml > node.log 2>&1 &
          NODE_BIN="$PWD/logos-blockchain-node" NODE_CFG="$PWD/standalone-node-config.yaml" \
          NODE_DEPLOYMENT="$PWD/standalone-deployment-config.yaml" APP_DATA="$PWD" \
          NAMES_RPC_URL=http://127.0.0.1:18545 NAMES_PROGRAM=US517G5965aydkZ46HS38QLi7UQiSojurfbQfKCELFx \
            nohup python3 ../app/server.py > app.log 2>&1 &
          sleep 5
      - name: Send coins through the web app and check both balances
        run: python3 tests/wallet_test.py send
      - name: LNS names - the vendored resolver against the SPEC vectors, then lookups and a send through the app
        run: |
          node --version
          APP_BASE=http://127.0.0.1:8090 APP_PIN=135790 \
          NAMES_FROM=e3635f207984ae779cf76b5f20714b514373f61ff96260879fe0a6d71f2dce07 \
          NAMES_TO=cce9796339efd968df9cd463bc2248e4b29c86409496e8b2599da8c4c1074d22 node tests/names_test.mjs
      - name: Node API - another local program spends with no credential (expected until the node patch); websites can't
        run: NODE_API=http://127.0.0.1:8080 APP_PIN=135790 python3 tests/local_api_probe.py
      - name: Logs, if something failed
        if: failure()
        run: tail -40 chain/node.log; cat chain/app.log
  node-socket:
    # The real node with patch 0002 (the app's "api" variant, built for Linux arm64 from the same commit in the
    # native-build run pinned in android/node.properties): its API on a Unix socket and on no TCP port, a bad socket
    # setting stops it instead of opening TCP, and the web app works over the socket, a real transfer included.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: The node with patch 0002, built for Linux from the pinned commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prop() { sed -n "s/^$1=//p" android/node.properties | tr -d '[:space:]'; }
          RUN=$(prop run); V=$(prop version); COMMIT=$(prop commit); SHA=$(prop linux-api.sha256)
          gh run download "$RUN" -R "$GITHUB_REPOSITORY" -n "logos-blockchain-node-linux-arm64-$V-api" -D nd
          [ "$(sha256sum nd/logos-blockchain-node | cut -d' ' -f1)" = "$SHA" ] || { echo "::error::not the pinned binary"; exit 1; }
          cat nd/SOURCE.txt nd/PATCHES.txt
          grep -q " commit $COMMIT, variant api," nd/SOURCE.txt
          mkdir chain && cp nd/logos-blockchain-node chain/ && chmod +x chain/logos-blockchain-node
          for f in standalone-node-config.yaml standalone-deployment-config.yaml; do
            curl -fsSL -o chain/$f "https://raw.githubusercontent.com/logos-blockchain/logos-blockchain/$V/nodes/node/$f"
          done
          grep -q "listen_address: 127.0.0.1:8080" chain/standalone-node-config.yaml
      - name: A bad socket setting stops the node; it never opens its API on TCP
        working-directory: chain
        run: |
          mkdir -m 755 shared; mkdir -m 700 private; touch private/file.sock
          try() {   # $1: what, $2: LOGOS_API_UNIX_SOCKET value
            rm -rf state; LOGOS_API_UNIX_SOCKET="$2" ./logos-blockchain-node --deployment standalone-deployment-config.yaml standalone-node-config.yaml > bad.log 2>&1 &
            P=$!
            for i in $(seq 1 120); do
              if ss -ltn | grep -q "127.0.0.1:8080 "; then echo "::error::$1: the API opened on TCP"; kill $P; exit 1; fi
              kill -0 $P 2>/dev/null || break
              sleep 1
            done
            if kill -0 $P 2>/dev/null; then echo "::error::$1: the node kept running"; kill $P; exit 1; fi
            wait $P && { echo "::error::$1: exit code 0"; exit 1; }
            grep -q "the node stops rather than open the API on TCP" bad.log || { tail -20 bad.log; exit 1; }
            echo "$1: stopped, nothing on TCP 8080"
          }
          try "empty value" ""
          try "relative path" "api.sock"
          try "a directory others can enter" "$PWD/shared/api.sock"
          try "a file that isn't a socket" "$PWD/private/file.sock"
          rm -rf state
      - name: Start the node on its socket and the web app over it
        working-directory: chain
        run: |
          mkdir -m 700 api
          LOGOS_API_UNIX_SOCKET="$PWD/api/api.sock" nohup ./logos-blockchain-node --deployment standalone-deployment-config.yaml standalone-node-config.yaml > node.log 2>&1 &
          for i in $(seq 1 120); do [ -S api/api.sock ] && curl -fsS --unix-socket api/api.sock http://node/cryptarchia/info >/dev/null 2>&1 && break; sleep 1; done
          curl -fsS --unix-socket api/api.sock http://node/cryptarchia/info; echo
          [ "$(stat -c %a api/api.sock)" = 600 ] || { echo "::error::the socket isn't 0600"; exit 1; }
          if ss -ltn | grep -q "127.0.0.1:8080 "; then echo "::error::the API is also on TCP"; exit 1; fi
          grep -h "listens on this Unix socket only" node.log logs/* 2>/dev/null | tail -1 || true
          NODE_API="unix:$PWD/api/api.sock" NODE_BIN="$PWD/logos-blockchain-node" NODE_CFG="$PWD/standalone-node-config.yaml" \
          NODE_DEPLOYMENT="$PWD/standalone-deployment-config.yaml" APP_DATA="$PWD" \
          NAMES_RPC_URL=http://127.0.0.1:18545 NAMES_PROGRAM=US517G5965aydkZ46HS38QLi7UQiSojurfbQfKCELFx \
            nohup python3 ../app/server.py > app.log 2>&1 &
          sleep 5
      - name: A real transfer through the web app, over the node's socket
        run: python3 tests/wallet_test.py send
      - name: Still nothing on TCP
        run: |
          ss -ltn
          if ss -ltn | grep -q "127.0.0.1:8080 "; then echo "::error::the API is on TCP"; exit 1; fi
      - name: Logs, if something failed
        if: failure()
        run: tail -60 chain/node.log; cat chain/app.log; tail -30 chain/bad.log || true
  termux:
    # Runs install-termux.sh inside the official Termux Docker image (Termux userland on arm64).
    # Not a real phone: it tests the script and that the node runs under proot.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install and start the node inside Termux
        run: |
          docker run --rm --security-opt seccomp=unconfined -e NO_WAKE_LOCK=1 -e APP_SRC=/repo/app -v "$PWD":/repo:ro termux/termux-docker:aarch64 bash -c '
            set -e
            # the image does not pass docker -e variables on to this shell: set them here
            export NO_WAKE_LOCK=1 APP_SRC=/repo/app
            # use the main package server instead of a random mirror: some mirrors answer CI with 429
            P=${PREFIX:-/data/data/com.termux/files/usr}
            [ -f "$P/etc/termux/mirrors/default" ] && ln -sf "$P/etc/termux/mirrors/default" "$P/etc/termux/chosen_mirrors"
            sh /repo/install-termux.sh
            # the app installed must be the one in this checkout, not a download from the release branch
            INST=$(find "${PREFIX:-/data/data/com.termux/files/usr}/var/lib/proot-distro" -path "*/root/node/app/server.py" 2>/dev/null | head -1)
            echo "installed app: ${INST:-not found}"
            for f in server.py messages/messages.js; do
              A=$(sha256sum < "/repo/app/$f"); B=$(sha256sum < "$(dirname "$INST")/$f")
              [ "$A" = "$B" ] || { echo "the installed $f is not this checkout"; exit 1; }
            done
            echo "installed the app from this checkout"
            (~/logos-node > ~/node.log 2>&1 &)
            for i in $(seq 1 36); do
              H=$(curl -fsS -m 5 http://127.0.0.1:8090/cryptarchia/info | grep -oE "\"height\":[0-9]+" | grep -oE "[0-9]+" || true)
              echo "height: ${H:-no answer yet}"
              if [ -n "$H" ] && [ "$H" -gt 100 ]; then
                curl -fsS http://127.0.0.1:8090/ | grep -q "<title>Names Wallet</title>" && echo "web app page ok" &&
                curl -fsS http://127.0.0.1:8090/names/lookup.js | grep -q lookupName && echo "names files ok" && exit 0
              fi
              sleep 10
            done
            tail -40 ~/node.log; exit 1'
  promote:
    # Phones update from the `release` branch. It moves to a commit only after every job above passed
    # on main, so a release reaches devices only once it is tested. This job alone may write.
    needs: [fresh-install, wallet-send, termux, app-update, chat-ui]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fast-forward release to the tested commit
        run: |
          python3 tools/release.py check
          if git fetch -q origin release; then
            if git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then echo "release already has this commit"; exit 0; fi
            git merge-base --is-ancestor FETCH_HEAD "$GITHUB_SHA" || { echo "release has commits main doesn't; not moving it"; exit 1; }
          fi
          git push origin "$GITHUB_SHA:refs/heads/release"
          echo "release -> $GITHUB_SHA (version $(python3 -c 'import json;print(json.load(open("app/release.json"))["version"])'))"
