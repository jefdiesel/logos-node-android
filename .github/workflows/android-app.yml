name: android-app
# Debug APK of the minimal Android app that runs the node (android/). The node binary is not rebuilt:
# it is the artifact of the latest successful native-build run on main, checked against its SHA256SUMS.
# The APK is kept as a workflow artifact only; nothing is published.
on:
  push:
    paths: ['android/**', 'app/**', .github/workflows/android-app.yml]
permissions:
  contents: read
  actions: read
env:
  GRADLE_VERSION: "8.14.3"
  BUILD_TOOLS: "36.0.0"
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Node binary from the latest successful native-build on main
        id: node
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN=$(gh run list -R "$GITHUB_REPOSITORY" --workflow native-build.yml --branch main --status success \
                --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -z "$RUN" ]; then echo "::error::no successful native-build run on main; build the node first"; exit 1; fi
          echo "native-build run $RUN"
          gh run download "$RUN" -R "$GITHUB_REPOSITORY" -p 'logos-blockchain-node-android-arm64-*' -D dl
          DIR=$(ls -d dl/logos-blockchain-node-android-arm64-* | head -1)
          [ -n "$DIR" ] || { echo "::error::run $RUN has no node artifact"; exit 1; }
          (cd "$DIR" && sha256sum -c SHA256SUMS)
          VERSION=${DIR##*-arm64-}
          SHA=$(awk '$2 ~ /logos-blockchain-node$/ {print $1}' "$DIR/SHA256SUMS")
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          cp "$DIR/logos-blockchain-node" android/app/src/main/jniLibs/arm64-v8a/liblogosnode.so
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "run=$RUN" >> "$GITHUB_OUTPUT"
          echo "node $VERSION, sha256 $SHA, from native-build run $RUN"
      - name: Messaging node files from the waku-build run of the pinned commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # the commit and the three files' sha256 are committed in android/ (messaging-commit.txt, messaging.sha256)
          # several runs may exist for one commit (e.g. started by hand with other options): take the
          # newest one whose files match the pinned sha256s exactly
          C=$(tr -d '[:space:]' < android/messaging-commit.txt)
          RUNS=$(gh run list -R "$GITHUB_REPOSITORY" --workflow waku-build.yml --commit "$C" --status success \
                 --limit 10 --json databaseId --jq '.[].databaseId')
          W=
          for RUN in $RUNS; do
            rm -rf wdl
            gh run download "$RUN" -R "$GITHUB_REPOSITORY" -p 'logos-delivery-android-arm64-*' -D wdl || continue
            D=$(ls -d wdl/logos-delivery-android-arm64-* 2>/dev/null | head -1)
            if [ -n "$D" ] && (cd "$D" && sha256sum --quiet -c "$GITHUB_WORKSPACE/android/messaging.sha256"); then
              W=$D; echo "waku-build run $RUN (commit $C) has the pinned files"; break
            fi
            echo "waku-build run $RUN: files differ from the pinned ones, trying the next run"
          done
          [ -n "$W" ] || { echo "::error::no waku-build run for commit $C has the files pinned in android/messaging.sha256"; exit 1; }
          (cd "$W" && sha256sum -c "$GITHUB_WORKSPACE/android/messaging.sha256")
          J=android/app/src/main/jniLibs/arm64-v8a
          cp "$W/waku-runner" "$J/libwakurunner.so"        # Android installs only lib*.so files
          cp "$W/liblogosdelivery.so" "$W/librln.so" "$J/"   # these keep their names: the runner and the library load them by name
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
      - name: Build the debug APK
        working-directory: android
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" "build-tools;$BUILD_TOOLS" >/dev/null
          # unit tests first: the snapshot import's tar reader, RocksDB check and state swap
          gradle --no-daemon testDebugUnitTest assembleDebug \
            -PnodeVersion=${{ steps.node.outputs.version }} -PnodeSha256=${{ steps.node.outputs.sha }}
      - name: Check the APK
        run: |
          set -o pipefail
          A=android/app/build/outputs/apk/debug/app-debug.apk
          BT="$ANDROID_HOME/build-tools/$BUILD_TOOLS"
          ls -la "$A"
          echo "== contents"; unzip -l "$A"
          echo "== badging"; "$BT/aapt2" dump badging "$A"
          echo "== manifest"; "$BT/aapt2" dump xmltree --file AndroidManifest.xml "$A" | tee manifest.txt
          echo "== apkanalyzer"; "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest print "$A" || true
          echo "== signature"; "$BT/apksigner" verify --print-certs "$A"
          fail() { echo "::error::$1"; exit 1; }
          # the node, byte for byte, for arm64-v8a only
          [ "$(unzip -p "$A" lib/arm64-v8a/liblogosnode.so | sha256sum | cut -d' ' -f1)" = "${{ steps.node.outputs.sha }}" ] \
            || fail "lib/arm64-v8a/liblogosnode.so is missing or differs from the node artifact"
          ! unzip -l "$A" | grep ' lib/' | grep -v ' lib/arm64-v8a/' || fail "native libraries for another ABI in the APK"
          # the messaging node: the three files byte for byte as pinned in android/messaging.sha256
          while read -r sum name; do
            [ "$name" = waku-runner ] && in_apk=libwakurunner.so || in_apk=$name
            [ "$(unzip -p "$A" "lib/arm64-v8a/$in_apk" | sha256sum | cut -d' ' -f1)" = "$sum" ] \
              || fail "lib/arm64-v8a/$in_apk is missing or differs from the pinned $name"
          done < android/messaging.sha256
          # the wallet: the repository's own app/ files, unchanged, and Python to run them
          for f in server.py index.html names/names.js names/lookup.js; do
            [ "$(unzip -p "$A" "assets/webapp/$f" | sha256sum | cut -d' ' -f1)" = "$(sha256sum "app/$f" | cut -d' ' -f1)" ] \
              || fail "assets/webapp/$f is missing or differs from app/$f"
          done
          unzip -l "$A" | grep -q ' lib/arm64-v8a/libpython3' || fail "no Python in the APK"
          grep -q '"io.github.jefdiesel.logosnode.WalletActivity"' manifest.txt || fail "WalletActivity not declared"
          grep -q ':wallet"' manifest.txt || fail "the wallet does not run in its own process"
          # extracted at install, so it can be run from nativeLibraryDir
          grep -q 'extractNativeLibs(0x010104ea)=true' manifest.txt || fail "extractNativeLibs is not true"
          # the service with its foreground type (specialUse = 0x40000000) and the permissions it needs
          grep -q 'NodeService' manifest.txt || fail "NodeService not declared"
          grep -q 'foregroundServiceType(0x01010599)=0x40000000' manifest.txt || fail "service is not foregroundServiceType=specialUse"
          grep -q 'PROPERTY_SPECIAL_USE_FGS_SUBTYPE' manifest.txt || fail "specialUse subtype property missing"
          for p in INTERNET FOREGROUND_SERVICE FOREGROUND_SERVICE_SPECIAL_USE POST_NOTIFICATIONS WAKE_LOCK USE_BIOMETRIC ACCESS_NETWORK_STATE; do
            grep -q "\"android.permission.$p\"" manifest.txt || fail "permission $p missing"
          done
          echo "all checks passed"
          mkdir out && cp "$A" "out/logos-node-${{ steps.node.outputs.version }}-debug.apk"
          (cd out && sha256sum *.apk > SHA256SUMS && cat SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: logos-node-app-debug-node${{ steps.node.outputs.version }}
          path: out/
