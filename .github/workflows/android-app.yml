name: android-app
# Debug APK of the minimal Android app that runs the node (android/). The node binary is not rebuilt:
# it is the artifact of the latest successful native-build run on main, checked against its SHA256SUMS.
# The APK is kept as a workflow artifact only; nothing is published.
on:
  push:
    paths: ['android/**', 'app/**', .github/workflows/android-app.yml]
permissions:
  contents: read
  actions: read
env:
  GRADLE_VERSION: "8.14.3"
  BUILD_TOOLS: "36.0.0"
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Node binary pinned in android/node.properties
        id: node
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prop() { sed -n "s/^$1=//p" android/node.properties | tr -d '[:space:]'; }
          VARIANT=$(prop variant); VERSION=$(prop version); RUN=$(prop run); SHA=$(prop "$VARIANT.sha256")
          case "$VARIANT" in patched) NAME="logos-blockchain-node-android-arm64-$VERSION-patched" ;;
                             unpatched) NAME="logos-blockchain-node-android-arm64-$VERSION" ;;
                             *) echo "::error::variant must be patched or unpatched, not '$VARIANT'"; exit 1 ;; esac
          [ -n "$SHA" ] && [ -n "$RUN" ] || { echo "::error::android/node.properties is incomplete"; exit 1; }
          gh run download "$RUN" -R "$GITHUB_REPOSITORY" -n "$NAME" -D dl
          [ "$(sha256sum dl/logos-blockchain-node | cut -d' ' -f1)" = "$SHA" ] \
            || { echo "::error::$NAME from run $RUN doesn't match the pinned sha256"; exit 1; }
          [ -f dl/PATCHES.txt ] && { echo "== PATCHES.txt"; cat dl/PATCHES.txt; }
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          cp dl/logos-blockchain-node android/app/src/main/jniLibs/arm64-v8a/liblogosnode.so
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "variant=$VARIANT" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "node $VERSION ($VARIANT), sha256 $SHA, from native-build run $RUN, artifact $NAME"
      - name: Messaging node files from the waku-build run of the pinned commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # the messaging files are pinned in android/ (messaging-run.txt, messaging.sha256)
          # pinned by run id (android/messaging-run.txt) and by each file's sha256 (android/messaging.sha256)
          RUN=$(tr -d '[:space:]' < android/messaging-run.txt)
          gh run download "$RUN" -R "$GITHUB_REPOSITORY" -p 'logos-delivery-android-arm64-*' -D wdl
          W=$(ls -d wdl/logos-delivery-android-arm64-* 2>/dev/null | head -1)
          [ -n "$W" ] || { echo "::error::waku-build run $RUN has no messaging artifact"; exit 1; }
          echo "waku-build run $RUN, artifact $(basename "$W")"
          (cd "$W" && sha256sum -c "$GITHUB_WORKSPACE/android/messaging.sha256")
          # every file pinned in messaging.sha256 (the set may change between versions, e.g. librln.so)
          J=android/app/src/main/jniLibs/arm64-v8a
          while read -r sum name; do
            if [ "$name" = waku-runner ]; then
              cp "$W/waku-runner" "$J/libwakurunner.so"    # Android installs only lib*.so files
            else
              cp "$W/$name" "$J/"                           # the libraries keep their names: they are loaded by name
            fi
          done < android/messaging.sha256
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
      - name: Build the debug APK
        working-directory: android
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" "build-tools;$BUILD_TOOLS" >/dev/null
          # unit tests first: the snapshot import's tar reader, RocksDB check and state swap
          gradle --no-daemon testDebugUnitTest assembleDebug \
            -PnodeVersion=${{ steps.node.outputs.version }} -PnodeSha256=${{ steps.node.outputs.sha }} -PnodeVariant=${{ steps.node.outputs.variant }}
      - name: Check the APK
        run: |
          set -o pipefail
          A=android/app/build/outputs/apk/debug/app-debug.apk
          BT="$ANDROID_HOME/build-tools/$BUILD_TOOLS"
          ls -la "$A"
          echo "== contents"; unzip -l "$A"
          echo "== badging"; "$BT/aapt2" dump badging "$A"
          echo "== manifest"; "$BT/aapt2" dump xmltree --file AndroidManifest.xml "$A" | tee manifest.txt
          echo "== apkanalyzer"; "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest print "$A" || true
          echo "== signature"; "$BT/apksigner" verify --print-certs "$A"
          fail() { echo "::error::$1"; exit 1; }
          # the node, byte for byte as pinned in android/node.properties, for arm64-v8a only
          [ "$(unzip -p "$A" lib/arm64-v8a/liblogosnode.so | sha256sum | cut -d' ' -f1)" = "${{ steps.node.outputs.sha }}" ] \
            || fail "lib/arm64-v8a/liblogosnode.so is missing or differs from the pinned ${{ steps.node.outputs.variant }} node"
          echo "bundled node: ${{ steps.node.outputs.version }}, ${{ steps.node.outputs.variant }}, sha256 ${{ steps.node.outputs.sha }}"
          ! unzip -l "$A" | grep ' lib/' | grep -v ' lib/arm64-v8a/' || fail "native libraries for another ABI in the APK"
          # the messaging node: the three files byte for byte as pinned in android/messaging.sha256
          while read -r sum name; do
            [ "$name" = waku-runner ] && in_apk=libwakurunner.so || in_apk=$name
            [ "$(unzip -p "$A" "lib/arm64-v8a/$in_apk" | sha256sum | cut -d' ' -f1)" = "$sum" ] \
              || fail "lib/arm64-v8a/$in_apk is missing or differs from the pinned $name"
          done < android/messaging.sha256
          # the wallet: the repository's own app/ files, unchanged, and Python to run them
          for f in server.py index.html names/names.js names/lookup.js; do
            [ "$(unzip -p "$A" "assets/webapp/$f" | sha256sum | cut -d' ' -f1)" = "$(sha256sum "app/$f" | cut -d' ' -f1)" ] \
              || fail "assets/webapp/$f is missing or differs from app/$f"
          done
          unzip -l "$A" | grep -q ' lib/arm64-v8a/libpython3' || fail "no Python in the APK"
          grep -q '"io.github.jefdiesel.logosnode.WalletActivity"' manifest.txt || fail "WalletActivity not declared"
          grep -q ':wallet"' manifest.txt || fail "the wallet does not run in its own process"
          # extracted at install, so it can be run from nativeLibraryDir
          grep -q 'extractNativeLibs(0x010104ea)=true' manifest.txt || fail "extractNativeLibs is not true"
          # the service with its foreground type (specialUse = 0x40000000) and the permissions it needs
          grep -q 'NodeService' manifest.txt || fail "NodeService not declared"
          grep -q 'foregroundServiceType(0x01010599)=0x40000000' manifest.txt || fail "service is not foregroundServiceType=specialUse"
          grep -q 'PROPERTY_SPECIAL_USE_FGS_SUBTYPE' manifest.txt || fail "specialUse subtype property missing"
          for p in INTERNET FOREGROUND_SERVICE FOREGROUND_SERVICE_SPECIAL_USE POST_NOTIFICATIONS WAKE_LOCK USE_BIOMETRIC ACCESS_NETWORK_STATE CAMERA; do
            grep -q "\"android.permission.$p\"" manifest.txt || fail "permission $p missing"
          done
          # exactly these permissions and no others (DUMP is the service's guard, not a permission the app asks for)
          got=$(grep -oE '"android\.permission\.[A-Z_]+"' manifest.txt | tr -d '"' | sed 's/android.permission.//' | sort -u | tr '\n' ' ')
          want="ACCESS_NETWORK_STATE CAMERA DUMP FOREGROUND_SERVICE FOREGROUND_SERVICE_SPECIAL_USE INTERNET POST_NOTIFICATIONS USE_BIOMETRIC WAKE_LOCK "
          [ "$got" = "$want" ] || fail "permissions are '$got', expected '$want'"
          # the QR scanner: our own screen in the wallet's process; the ZXing library's screen is not in the app,
          # and no Google Play services, ML Kit, Firebase or AndroidX code came along with it
          grep -q '"io.github.jefdiesel.logosnode.ScanActivity"' manifest.txt || fail "ScanActivity not declared"
          ! grep -q 'com.journeyapps.barcodescanner.CaptureActivity' manifest.txt || fail "ZXing's CaptureActivity is in the manifest"
          for c in Lcom/google/android/gms/ Lcom/google/mlkit/ Lcom/google/firebase/ Lcom/google/android/datatransport/ Landroidx/activity/; do
            ! unzip -p "$A" 'classes*.dex' | grep -aq "$c" || fail "unexpected classes in the APK: $c"
          done
          unzip -p "$A" 'classes*.dex' | grep -aq 'Lcom/journeyapps/barcodescanner/BarcodeView;' || fail "the ZXing scanner is not in the APK"
          echo "all checks passed"
          mkdir out && cp "$A" "out/logos-node-${{ steps.node.outputs.version }}-${{ steps.node.outputs.variant }}-debug.apk"
          (cd out && sha256sum *.apk > SHA256SUMS && cat SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: logos-node-app-debug-node${{ steps.node.outputs.version }}-${{ steps.node.outputs.variant }}
          path: out/
